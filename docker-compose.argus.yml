# Argus Sentinel: an ML classifier (clean / attack) that the WAF asks about
# each request, after the OWASP CRS. An override of docker-compose.yml; it
# changes nothing unless you name it:
#
#   docker compose -f docker-compose.yml -f docker-compose.argus.yml up -d
#
# (or put COMPOSE_FILE=docker-compose.yml:docker-compose.argus.yml in .env
# and run docker compose as usual; other overrides such as
# docker-compose.crowdsec.yml can be listed too). Needs in .env:
#
#   ARGUS_MODEL_DIR=/opt/argus/model   host directory holding model.onnx,
#                                      tokenizer.json, config.json,
#                                      preprocess.py and inference_cpu.py,
#                                      readable by UID 10000
#
# The sidecar (github.com/mobytefon/argus-sidecar) answers gRPC on a unix
# socket in the argus-run volume, which docker-compose.yml already mounts in
# caddy at /run/argus; Caddy's WAF calls it through the mlcheck action
# (github.com/mobytefon/coraza-mlcheck, built into the caddy image). The
# sidecar has no network at all. Nothing happens until the mlcheck rules from
# documentation/argus-ml.md are added to the WAF custom directives; when the
# sidecar is down or busy, requests go on without an ML verdict (fail open).
#
# New model: copy the new files over ARGUS_MODEL_DIR while everything runs.
# The sidecar notices the change, waits until the files stop changing, loads
# and checks the new model and only then switches to it; a model that does
# not load leaves the old one serving. See documentation/argus-ml.md.
#
# The caddy service is left as it is: the l4-port-manager recreates caddy
# with docker-compose.yml and at most one extra file, and the socket volume
# is already in docker-compose.yml.
#
# Load limits: the sidecar takes at most ARGUS_MAX_CONCURRENT_RPCS requests
# at once. Caddy's own cap (ARGUS_MAX_INFLIGHT, default 16) must not be
# higher; the two defaults are equal.

services:
  argus-sidecar:
    container_name: ingressi-argus
    image: ghcr.io/mobytefon/argus-sidecar:${ARGUS_SIDECAR_VERSION:-v0.2.0}
    # Used when the image cannot be pulled, or with --build.
    build:
      context: https://github.com/mobytefon/argus-sidecar.git#${ARGUS_SIDECAR_VERSION:-v0.2.0}
    restart: unless-stopped
    # The sidecar only listens on the unix socket; it needs no network.
    network_mode: none
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      ARGUS_MODEL_DIR: /model
      ARGUS_SOCKET: /run/argus/argus.sock
      # A threshold preset from the model's config.json (fpr0.1%, fpr0.5%,
      # fpr1%, 0.5) or a number in [0,1]; attack when attack_prob > threshold.
      ARGUS_THRESHOLD: ${ARGUS_THRESHOLD:-fpr0.1%}
      ARGUS_WORKERS: ${ARGUS_WORKERS:-4}
      ARGUS_MAX_CONCURRENT_RPCS: ${ARGUS_MAX_CONCURRENT_RPCS:-16}
      ARGUS_MIN_REMAINING_MS: ${ARGUS_MIN_REMAINING_MS:-5}
      # How often the model files are checked for a new model; 0 turns it off.
      ARGUS_RELOAD_INTERVAL_S: ${ARGUS_RELOAD_INTERVAL_S:-5}
      ORT_INTRA_THREADS: ${ORT_INTRA_THREADS:-1}
      LOG_LEVEL: ${ARGUS_LOG_LEVEL:-INFO}
    volumes:
      - ${ARGUS_MODEL_DIR:?ERROR - ARGUS_MODEL_DIR is required}:/model:ro
      - argus-run:/run/argus
    cpus: ${ARGUS_CPUS:-2}
    mem_limit: ${ARGUS_MEM_LIMIT:-512m}
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
